<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reach1M - Free Promotion</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}
.container{
  max-width:600px;
  margin:60px auto;
  padding:20px;
}
.card{
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  text-align:center;
}
h1{
  margin-bottom:10px;
}
p{
  color:#555;
}
input{
  width:90%;
  padding:14px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}
button{
  background:#2563eb;
  color:white;
  border:none;
  padding:14px 25px;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Reach1M 🚀</h1>
    <h2>Free Promotion</h2>
    <p>🎁 First 50 Users — FREE!</p>
    <p>Submit your details to get started.</p>

    <form action="https://formspree.io/f/xzezjqoa" method="POST">

      <input
        type="text"
        name="name"
        placeholder="Your Name"
        required
      >

      <input
        type="email"
        name="email"
        placeholder="Your Email"
        required
      >

      <input
        type="url"
        name="youtube"
        placeholder="YouTube Video or Channel Link"
        required
      >

      <button type="submit">
        Submit Free Promotion
      </button>

    </form>

  </div>
</div>

</body>
</html>
